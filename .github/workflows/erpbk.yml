name: Deploy to HostGator

on:
  push:
    branches:
      - main  # or 'master' or whichever branch you use

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTGATOR_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 erpbk.com >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -az --delete ./ saima@erpbk.com:/home2/sxjnqpte/public_html/
