name: Deploy to HostGator via FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          passive: true 
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}
          state-name: deployment-state.json  # Enables incremental deploy
          exclude: |
            **/.git*
            **/node_modules/**
            **/docker/**
            Dockerfile
            **/*.log
          dry-run: false
