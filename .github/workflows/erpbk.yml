name: Deploy to HostGator

on:
  push:
    branches:
      - main  # Change to your default branch if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTGATOR_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Prevent known_hosts warning
          ssh-keyscan -p 22 erpbk.com >> ~/.ssh/known_hosts

          # Force use of this key only
          echo "Host erpbk.com
            HostName erpbk.com
            User saima
            Port 22
            IdentityFile ~/.ssh/id_rsa
            IdentitiesOnly yes
          " > ~/.ssh/config

      - name: Deploy via rsync
        run: |
          rsync -az --delete ./ sxjnqpte@erpbk.com:/home2/sxjnqpte/public_html/website_28dba112
