name: Deploy to HostGator

on:
  push:
    branches:
      - main  # or 'master' depending on your repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.HOSTGATOR_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -p 22 erpbk.com >> ~/.ssh/known_hosts

    - name: Deploy via rsync
      run: |
        rsync -az --delete ./ sxjnqpte@erpbk.com:/home2/sxjnqpte/public_html/
